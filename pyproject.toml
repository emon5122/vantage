[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage-il2cpp"
version = "0.1.0"
description = "Observation-only runtime analysis & protocol-intelligence framework for Unity IL2CPP applications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Vantage contributors" }]
keywords = [
  "reverse-engineering", "unity", "il2cpp", "frida", "dynamic-analysis",
  "protocol-analysis", "messagepack", "fpnn", "android", "security-research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]
dependencies = []  # core (offline) analysis has NO third-party runtime deps

[project.optional-dependencies]
instrument = ["frida>=16.2,<18", "frida-tools>=12.4"]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.4", "black>=24.0"]

[project.urls]
Homepage = "https://github.com/emon5122/vantage"
Documentation = "https://github.com/emon5122/vantage/tree/main/docs"
Issues = "https://github.com/emon5122/vantage/issues"
Changelog = "https://github.com/emon5122/vantage/blob/main/CHANGELOG.md"

[project.scripts]
vantage = "vantage.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vantage = ["kb/*.sql", "configs/*.json", "agent/**/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long lines tolerated in evidence tables / spec constants

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.coverage.run]
source = ["vantage"]
branch = true
