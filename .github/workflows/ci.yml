name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Black (check)
        run: black --check .

  agent-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check on all agent modules
        run: |
          set -e
          find src/vantage/agent -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "all agent JS parsed"

  observation-only-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject behaviour-altering / offensive primitives
        run: |
          set -e
          PAT='Interceptor\.replace|Memory\.write|Memory\.protect\([^)]*rwx|writeByteArray|patchCode|\.overwrite\('
          if grep -RInE "$PAT" src/vantage/agent 2>/dev/null; then
            echo "::error::Found a behaviour-altering primitive in the agent. Vantage is observation-only."
            exit 1
          fi
          echo "observation-only guard passed"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - name: Pytest
        run: pytest -q --cov=vantage --cov-report=term-missing
