name: Bug report
description: Report a defect in Vantage (not a vulnerability — see SECURITY.md)
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security** issues, do not use this form — see
        [SECURITY.md](../../SECURITY.md). Do not paste captured data from a real target.
  - type: input
    id: version
    attributes:
      label: Vantage version / commit
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [protocol, metadata, knowledge-base, instrument, cli, docs, plugins, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs. actual behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps. Prefer the synthetic sample-data / generator; never real captures.
      render: shell
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, and (if relevant) frida-server + device ABI.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: My report does not request or describe automation/injection/bypass functionality.
          required: true
        - label: I am not attaching data captured from software I am not authorised to analyse.
          required: true
